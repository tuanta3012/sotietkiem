name: Auto Build & Release APK from AI Studio Code

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm "Run workflow" thủ công trên web GitHub bất cứ lúc nào

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Cấu hình môi trường Node.js và JDK 21
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 2. Tự động lấy versionName từ package.json & versionCode từ Git Commit Count
      - name: Determine Auto Version
        id: auto_version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          PACKAGE_VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          echo "CODE=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "NAME=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "Auto Generated versionCode: $BUILD_NUMBER, versionName: $PACKAGE_VERSION"

      # 3. Tạo init.gradle cấp hệ thống giải quyết triệt để lỗi BouncyCastle (bcprov)
      - name: Create Gradle Init Script for BouncyCastle
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  configurations.all {
                      resolutionStrategy {
                          force 'org.bouncycastle:bcprov-jdk15to18:1.70'
                          dependencySubstitution {
                              substitute module('org.bouncycastle:bcprov-jdk18on') using module('org.bouncycastle:bcprov-jdk15to18:1.70')
                          }
                      }
                  }
              }
              configurations.all {
                  resolutionStrategy {
                      force 'org.bouncycastle:bcprov-jdk15to18:1.70'
                      dependencySubstitution {
                          substitute module('org.bouncycastle:bcprov-jdk15to18:1.70')
                          dependencySubstitution {
                              substitute module('org.bouncycastle:bcprov-jdk18on') using module('org.bouncycastle:bcprov-jdk15to18:1.70')
                          }
                      }
                  }
              }
          }
          EOF

      # 4. Cài đặt Thư viện & Build Web Assets
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      # 5. Sinh dự án Android & Đồng bộ Capacitor
      - name: Capacitor Sync / Add Android
        run: |
          npx cap add android || true
          npx cap sync android

      # 6. Copy google-services.json (nếu có) & Sinh Icon cho App
      - name: Copy google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
          fi

      - name: Generate App Icons
        run: |
          npx @capacitor/assets generate --android || true

      # 7. Cập nhật Android SDK (minSdk 23, compileSdk/targetSdk 35) & Version
      - name: Update Android SDK & Version
        run: |
          if [ -f "android/variables.gradle" ]; then
            sed -i "s/minSdkVersion = .*/minSdkVersion = 23/g" android/variables.gradle
            sed -i "s/compileSdkVersion = .*/compileSdkVersion = 35/g" android/variables.gradle
            sed -i "s/targetSdkVersion = .*/targetSdkVersion = 35/g" android/variables.gradle
          fi
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.auto_version.outputs.CODE }}/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.auto_version.outputs.NAME }}\"/g" android/app/build.gradle

      # 8. Khai báo Keystore cố định từ GitHub Secrets (An toàn 100% qua biến env)
      - name: Setup Fixed Keystore & Print SHA-1
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore
            echo ">>> Giải mã thành công Keystore từ GitHub Secrets!"
          else
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
            
            echo "=== TẠO CHUỖI BASE64 ĐỂ LƯU CỐ ĐỊNH ==="
            base64 -w 0 ~/.android/debug.keystore
          fi
          
          echo "===================================================="
          echo "=== FIXED SHA-1 FINGERPRINT FOR FIREBASE CONSOLE ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep "SHA1:"
          echo "===================================================="

      # 9. Đóng gói APK bằng Gradle (Sử dụng Keystore cố định ở bước 8)
      - name: Build Android APK
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 10. Đổi tên tệp APK về định dạng chuẩn sotietkiem_v[version].apk
      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk sotietkiem_v${{ steps.auto_version.outputs.NAME }}.apk

      # 11. Tự động tạo GitHub Release & đính kèm APK
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.auto_version.outputs.NAME }}
          name: Bản cập nhật v${{ steps.auto_version.outputs.NAME }}
          body: |
            Bản cập nhật tự động xuất bản từ AI Studio.
          files: sotietkiem_v${{ steps.auto_version.outputs.NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 12. Tự động cập nhật file version.json trên nhánh main
      - name: Update version.json
        run: |
          APK_URL="https://github.com/tuanta3012/sotietkiem/releases/download/v${{ steps.auto_version.outputs.NAME }}/sotietkiem_v${{ steps.auto_version.outputs.NAME }}.apk"
          cat <<EOF > version.json
          {
            "version": "${{ steps.auto_version.outputs.NAME }}",
            "notes": "Bản cập nhật tự động v${{ steps.auto_version.outputs.NAME }}",
            "apkUrl": "$APK_URL"
          }
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: auto-update version.json [skip ci]" || echo "No changes to commit"
          git push
