name: Auto Build & Release APK from AI Studio Code

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Cấu hình môi trường Node.js và JDK 21
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 2. Tự động lấy versionName từ package.json & versionCode từ Git Commit Count
      - name: Determine Auto Version
        id: auto_version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD 2>/dev/null || echo "1")
          PACKAGE_VERSION=$(node -p "try { require('./package.json').version || '1.0.0' } catch(e) { '1.0.0' }")
          echo "CODE=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "NAME=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "Auto Generated versionCode: $BUILD_NUMBER, versionName: $PACKAGE_VERSION"

      # 3. Tạo init.gradle cấp hệ thống giải quyết triệt để lỗi BouncyCastle (bcprov)
      - name: Create Gradle Init Script for BouncyCastle
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  configurations.all {
                      resolutionStrategy {
                          force 'org.bouncycastle:bcprov-jdk15to18:1.70'
                          dependencySubstitution {
                              substitute module('org.bouncycastle:bcprov-jdk18on') using module('org.bouncycastle:bcprov-jdk15to18:1.70')
                          }
                      }
                  }
              }
              configurations.all {
                  resolutionStrategy {
                      force 'org.bouncycastle:bcprov-jdk15to18:1.70'
                      dependencySubstitution {
                          substitute module('org.bouncycastle:bcprov-jdk18on') using module('org.bouncycastle:bcprov-jdk15to18:1.70')
                      }
                  }
              }
          }
          EOF

      # 4. Cài đặt các thư viện cần thiết (bao gồm cả Capacitor Android Core)
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      # 5. Khởi tạo lại hoàn toàn thư mục Android nếu bị rỗng / thiếu file build.gradle
      - name: Generate Fresh Android Project
        run: |
          if [ ! -f "android/build.gradle" ]; then
            echo "Thư mục android bị rỗng hoặc chưa hoàn chỉnh. Tiến hành khởi tạo mới..."
            rm -rf android
            npx cap add android
          fi

      # 6. Cập nhật SDK, strings.xml (server_client_id cho Google Auth) & Phiên bản
      - name: Update Android Config, SDK & Strings
        env:
          VERSION_CODE: ${{ steps.auto_version.outputs.CODE }}
          VERSION_NAME: ${{ steps.auto_version.outputs.NAME }}
        run: |
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">Tiết Kiệm Gia Đình</string>
              <string name="title_activity_main">Tiết Kiệm Gia Đình</string>
              <string name="package_name">com.tietkiemgiadinh.app</string>
              <string name="custom_url_scheme">com.tietkiemgiadinh.app</string>
              <string name="server_client_id">864440372329-fgoo89lqp196nvcptmfc7pquofuj8agt.apps.googleusercontent.com</string>
          </resources>
          EOF

          if [ -f "android/variables.gradle" ]; then
            sed -i "s/minSdkVersion = .*/minSdkVersion = 23/g" android/variables.gradle
            sed -i "s/compileSdkVersion = .*/compileSdkVersion = 35/g" android/variables.gradle
            sed -i "s/targetSdkVersion = .*/targetSdkVersion = 35/g" android/variables.gradle
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/g" android/app/build.gradle
            sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle
          fi

          # Cấu hình triệt để ngăn chặn Google One khôi phục snapshot sao lưu ngoài ý muốn khi cài mới
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude path="." />
              </device-transfer>
          </data-extraction-rules>
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/backup_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <exclude domain="root" path="." />
              <exclude domain="file" path="." />
              <exclude domain="database" path="." />
              <exclude domain="sharedpref" path="." />
              <exclude domain="external" path="." />
          </full-backup-content>
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:allowBackup="true"/android:allowBackup="false" android:fullBackupOnly="false" android:dataExtractionRules="@xml\/data_extraction_rules" android:fullBackupContent="@xml\/backup_rules"/g' android/app/src/main/AndroidManifest.xml
          fi

      # 7. Copy google-services.json (nếu có) & Tạo icon
      - name: Copy google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
          fi

      - name: Install ImageMagick for Icon Generation
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate App Icons
        run: |
          python3 scripts/generate_app_icons.py
          npx @capacitor/assets generate --android || true
          python3 scripts/generate_app_icons.py

      # 8. Khởi tạo & Sử dụng Keystore cố định trong Repo (Không bao giờ đổi SHA-1)
      - name: Setup Permanent Fixed Keystore
        run: |
          mkdir -p keystore ~/.android android/app
          
          # 1. Ưu tiên giải mã Keystore vĩnh viễn từ file b64 trong Repo
          if [ -f "keystore/debug.keystore.b64" ]; then
            echo "Khôi phục Keystore cố định từ keystore/debug.keystore.b64..."
            base64 -d keystore/debug.keystore.b64 > keystore/debug.keystore
          elif [ ! -f "keystore/debug.keystore" ]; then
            echo "Khởi tạo Keystore cố định cho Repository..."
            keytool -genkeypair -v \
              -keystore keystore/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
            base64 -w 0 keystore/debug.keystore > keystore/debug.keystore.b64
          fi
          
          # Đồng bộ keystore cố định vào các vị trí chuẩn của Android build
          cp keystore/debug.keystore ~/.android/debug.keystore
          cp keystore/debug.keystore android/app/debug.keystore
          
          # Cấu hình tường minh signingConfig debug trong android/app/build.gradle
          if [ -f "android/app/build.gradle" ]; then
            node -e "
              const fs = require('fs');
              const file = 'android/app/build.gradle';
              let content = fs.readFileSync(file, 'utf8');
              if (!content.includes('signingConfigs {')) {
                const signingBlock = 'signingConfigs {\\n        debug {\\n            storeFile file(\\'debug.keystore\\')\\n            storePassword \\'android\\'\\n            keyAlias \\'androiddebugkey\\'\\n            keyPassword \\'android\\'\\n        }\\n    }\\n    buildTypes {';
                content = content.replace('buildTypes {', signingBlock);
                content = content.replace('release {', 'release {\\n        signingConfig signingConfigs.debug');
                fs.writeFileSync(file, content, 'utf8');
              }
            "
          fi
          
          SHA1_VAL=$(keytool -list -v -keystore keystore/debug.keystore -alias androiddebugkey -storepass android | grep "SHA1:" | head -1 | awk '{print $2}')
          
          echo "===================================================="
          echo "=== PERMANENT SHA-1 FINGERPRINT FOR FIREBASE ======="
          echo "SHA-1: $SHA1_VAL"
          echo "===================================================="
          
          echo "### 🔑 Android App Fingerprints (SHA-1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name:** \`com.tietkiemgiadinh.app\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cố định SHA-1:** \`$SHA1_VAL\`" >> $GITHUB_STEP_SUMMARY
          echo "- Mã này được cố định vĩnh viễn trong file \`keystore/debug.keystore\`." >> $GITHUB_STEP_SUMMARY
          echo "- Hãy đối chiếu với Firebase Console: nếu chưa có mã trên, bấm **Add fingerprint** và dán vào." >> $GITHUB_STEP_SUMMARY

      # 9. Biên dịch phiên bản APK Sideload (Có bật Kiểm tra cập nhật)
      - name: Build Web Assets for APK
        env:
          VITE_APP_MODE: apk
        run: npm run build

      - name: Sync APK Assets to Android
        run: npx cap sync android

      - name: Compile APK file
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p dist-release
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-release/sotietkiem_v${{ steps.auto_version.outputs.NAME }}.apk

      # 10. Biên dịch phiên bản AAB cho Google Play (Dọn sạch hoàn toàn Kiểm tra cập nhật)
      - name: Build Web Assets for Google Play AAB
        env:
          VITE_APP_MODE: play
        run: npm run build

      - name: Sync AAB Assets to Android
        run: npx cap sync android

      - name: Compile AAB file
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Copy & Rename AAB
        run: |
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab dist-release/sotietkiem_v${{ steps.auto_version.outputs.NAME }}.aab
          elif [ -f "android/app/build/outputs/bundle/debug/app-debug.aab" ]; then
            cp android/app/build/outputs/bundle/debug/app-debug.aab dist-release/sotietkiem_v${{ steps.auto_version.outputs.NAME }}.aab
          fi

      # 11. Tự động tạo GitHub Release & đính kèm cả file APK lẫn AAB
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.auto_version.outputs.NAME }}
          name: Bản cập nhật v${{ steps.auto_version.outputs.NAME }}
          body: |
            Bản cập nhật tự động xuất bản từ AI Studio:
            - **sotietkiem_v${{ steps.auto_version.outputs.NAME }}.apk**: Bản APK cài đặt trực tiếp bên ngoài (có tích hợp thông báo cập nhật tự động).
            - **sotietkiem_v${{ steps.auto_version.outputs.NAME }}.aab**: File Android App Bundle để tải lên Google Play Console (dọn sạch hoàn toàn hiển thị và tính năng cập nhật, 100% tuân thủ chính sách kiểm duyệt).
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 12. Tự động cập nhật file version.json trên nhánh main
      - name: Update version.json
        run: |
          APK_URL="https://github.com/tuanta3012/sotietkiem/releases/download/v${{ steps.auto_version.outputs.NAME }}/sotietkiem_v${{ steps.auto_version.outputs.NAME }}.apk"
          cat <<EOF > version.json
          {
            "version": "${{ steps.auto_version.outputs.NAME }}",
            "notes": "Bản cập nhật tự động v${{ steps.auto_version.outputs.NAME }}",
            "apkUrl": "$APK_URL"
          }
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: auto-update version.json [skip ci]" || echo "No changes to commit"
          git push
